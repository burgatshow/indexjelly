<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IndexJelly</title>
</head>
<body>
<div id="IndexJellyPage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="IndexJelly">
<style>
#IndexJellyPage {
    --ij-text: #eceef1;
    --ij-muted: #9198a1;
    --ij-soft: #c9ced4;
    --ij-faint: rgba(255,255,255,.07);
    --ij-line: rgba(255,255,255,.10);
    --ij-surface: rgba(255,255,255,.035);
    --ij-done: #3fd68f;
    --ij-warn: #ffb23f;
    --ij-fail: #ff6f61;
    --ij-op: #7fc8ff;
    --ij-brand: #00a4dc;
    --ij-bg: #101216;
}
#IndexJellyPage .ij { max-width: 1280px; margin: 0 auto; padding: 1.6em 1.6em 4em; color: var(--ij-text); font-variant-numeric: tabular-nums; }
#IndexJellyPage .ij * { box-sizing: border-box; }
#IndexJellyPage a { color: inherit; text-decoration: none; }
#IndexJellyPage a:hover { color: var(--ij-brand); }

/* ---------- top bar (as in StreamJelly) ---------- */
#IndexJellyPage .ij-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.2em 2.5em; margin-bottom: 2em; }
#IndexJellyPage .ij-bar h1 { font-size: 1.9em; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
#IndexJellyPage .ij-sub { color: var(--ij-muted); font-size: .9em; margin-top: .35em; }
#IndexJellyPage .ij-sub .busy { color: var(--ij-op); }
#IndexJellyPage .ij-totals { display: flex; gap: 2.2em; margin-left: auto; }
#IndexJellyPage .ij-total b { display: block; font-size: 1.6em; font-weight: 650; line-height: 1.1; }
#IndexJellyPage .ij-total span { color: var(--ij-muted); font-size: .82em; }
#IndexJellyPage .ij-total.done b { color: var(--ij-done); }
#IndexJellyPage .ij-actions { display: flex; gap: .5em; flex-wrap: wrap; }
#IndexJellyPage .ij-btn { background: none; border: 1px solid var(--ij-line); color: var(--ij-muted); border-radius: 8px; padding: .45em .8em; cursor: pointer; font: inherit; font-size: .85em; white-space: nowrap; }
#IndexJellyPage .ij-btn:hover, #IndexJellyPage .ij-btn[aria-expanded="true"] { color: var(--ij-text); border-color: rgba(255,255,255,.25); }
#IndexJellyPage .ij-btn:disabled { opacity: .5; cursor: default; }
#IndexJellyPage .ij-pillbtn { background: rgba(255,255,255,.08); border: 0; color: var(--ij-text); border-radius: 999px; padding: .35em .9em; font: inherit; font-size: .8em; cursor: pointer; white-space: nowrap; }
#IndexJellyPage .ij-pillbtn:hover { background: rgba(255,255,255,.16); }
#IndexJellyPage .ij-pillbtn:disabled { opacity: .55; cursor: default; }
#IndexJellyPage .ij-settings { display: none; flex-wrap: wrap; gap: 1em 1.6em; align-items: center; padding: 1em 1.2em; margin: -1em 0 2em; border: 1px solid var(--ij-line); border-radius: 10px; font-size: .9em; }
#IndexJellyPage .ij-settings.open { display: flex; }
#IndexJellyPage .ij-settings label { display: flex; gap: .45em; align-items: center; color: var(--ij-muted); }
#IndexJellyPage .ij-settings input[type=number] { width: 4.6em; background: var(--ij-faint); border: 1px solid var(--ij-line); color: var(--ij-text); border-radius: 6px; padding: .3em .4em; font: inherit; }
#IndexJellyPage .ij-save { margin-left: auto; background: var(--ij-brand); color: #fff; border: 0; border-radius: 6px; padding: .5em 1.1em; font: inherit; font-weight: 600; cursor: pointer; }

#IndexJellyPage .ij-section { margin-bottom: 2.4em; }
#IndexJellyPage .ij-section > h2 { font-size: 1.05em; font-weight: 650; margin: 0 0 .9em; color: var(--ij-soft); }
#IndexJellyPage .ij-stack { display: grid; gap: 1.1em; }

/* ---------- cards ---------- */
#IndexJellyPage .ij-panel { position: relative; border-radius: 16px; overflow: hidden; background: var(--ij-surface); border: 1px solid var(--ij-line); }
#IndexJellyPage .ij-hero { position: relative; display: flex; gap: 1.4em; align-items: flex-end; padding: 1.6em 1.6em 1.3em; min-height: 150px; isolation: isolate; }
#IndexJellyPage .ij-hero.short { min-height: 0; align-items: center; padding: 1.3em 1.6em; }
#IndexJellyPage .ij-hero-bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center 25%; opacity: .38; }
#IndexJellyPage .ij-hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,18,22,.96) 0%, rgba(16,18,22,.75) 45%, rgba(16,18,22,.35) 100%), linear-gradient(0deg, rgba(16,18,22,1) 0%, rgba(16,18,22,0) 60%); }
#IndexJellyPage .ij-poster { width: 92px; aspect-ratio: 2/3; border-radius: 8px; background: var(--ij-faint) center/cover; flex: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
#IndexJellyPage .ij-poster.sq { aspect-ratio: 1; }
#IndexJellyPage .ij-heading { min-width: 0; flex: 1; }
#IndexJellyPage .ij-kicker { color: var(--ij-muted); font-size: .92em; margin-bottom: .15em; }
#IndexJellyPage .ij-name { font-size: 1.55em; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin: 0 0 .55em; overflow-wrap: anywhere; }
#IndexJellyPage .ij-hero.short .ij-name { font-size: 1.2em; margin-bottom: .3em; }
#IndexJellyPage .ij-chips { display: flex; flex-wrap: wrap; gap: .4em; }
#IndexJellyPage .ij-chip { font-size: .8em; padding: .25em .65em; border-radius: 999px; background: rgba(255,255,255,.08); color: #d5d9de; white-space: nowrap; }
#IndexJellyPage .ij-chip.op { color: var(--ij-op); background: rgba(0,164,220,.12); }
#IndexJellyPage .ij-chip.new { color: var(--ij-done); background: rgba(63,214,143,.1); }
#IndexJellyPage .ij-side { text-align: right; flex: none; align-self: flex-start; display: flex; flex-direction: column; align-items: flex-end; gap: .55em; }
#IndexJellyPage .ij-big { font-size: 2.1em; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
#IndexJellyPage .ij-big.done { color: var(--ij-done); }
#IndexJellyPage .ij-big-note { color: var(--ij-muted); font-size: .8em; margin-top: -.2em; }
#IndexJellyPage .ij-pill { display: inline-block; font-weight: 700; font-size: .78em; padding: .22em .7em; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; background: none; font-family: inherit; }
#IndexJellyPage .ij-pill.done { color: var(--ij-done); }
#IndexJellyPage .ij-pill.run { color: var(--ij-op); }
#IndexJellyPage .ij-pill.warn { color: var(--ij-warn); }
#IndexJellyPage .ij-pill.fail { color: var(--ij-fail); }
#IndexJellyPage .ij-pill.muted { color: var(--ij-muted); }
#IndexJellyPage button.ij-pill { cursor: pointer; }
#IndexJellyPage button.ij-pill:hover, #IndexJellyPage button.ij-pill[aria-expanded="true"] { background: rgba(255,178,63,.12); }

/* progress */
#IndexJellyPage .ij-time { display: flex; align-items: center; gap: .9em; padding: 0 1.6em 1.2em; font-size: .82em; color: var(--ij-muted); }
#IndexJellyPage .ij-track { position: relative; flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
#IndexJellyPage .ij-track b { position: absolute; inset: 0 auto 0 0; background: var(--ij-brand); border-radius: 4px; transition: width .4s ease; }
#IndexJellyPage .ij-track.done b { background: var(--ij-done); }
#IndexJellyPage .ij-track.live b { background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,.35) 50%, rgba(255,255,255,0) 100%); background-size: 200% 100%; animation: ij-shine 1.6s linear infinite; }
#IndexJellyPage .ij-track.indet b { width: 30% !important; animation: ij-indet 1.4s ease-in-out infinite; }
@keyframes ij-shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes ij-indet { from { left: -30%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { #IndexJellyPage .ij-track.live b, #IndexJellyPage .ij-track.indet b { animation: none; } }

/* compact item cards */
#IndexJellyPage .ij-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: .7em; padding: 0 1.6em 1.4em; }
#IndexJellyPage .ij-cards-head { padding: .2em 1.6em .7em; color: var(--ij-muted); font-size: .8em; }
#IndexJellyPage .ij-card { display: flex; gap: .85em; padding: .7em; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--ij-faint); min-width: 0; }
#IndexJellyPage .ij-card:hover { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.05); }
#IndexJellyPage .ij-cover { width: 46px; aspect-ratio: 2/3; flex: none; border-radius: 6px; background: var(--ij-faint) center/cover; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
#IndexJellyPage .ij-cover.sq { aspect-ratio: 1; align-self: flex-start; }
#IndexJellyPage .ij-card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#IndexJellyPage .ij-card-top { display: flex; gap: .6em; align-items: flex-start; }
#IndexJellyPage .ij-card-top > div { flex: 1; min-width: 0; }
#IndexJellyPage .ij-card-title { font-weight: 650; font-size: .95em; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#IndexJellyPage .ij-card-sub { color: var(--ij-muted); font-size: .8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .1em; }
#IndexJellyPage .ij-card-op { color: var(--ij-op); font-size: .8em; margin-top: auto; padding-top: .45em; display: flex; justify-content: space-between; gap: .6em; }
#IndexJellyPage .ij-card-op span:last-child { color: var(--ij-muted); white-space: nowrap; }
#IndexJellyPage .ij-card .ij-track { flex: none; height: 3px; margin-top: .4em; }
#IndexJellyPage .ij-card .ij-pill { font-size: .68em; }
#IndexJellyPage .ij-more { padding: 0 1.6em 1.2em; color: var(--ij-muted); font-size: .8em; margin-top: -.6em; }

/* idle */
#IndexJellyPage .ij-idle { display: flex; align-items: center; gap: 1.2em; padding: 1.2em 1.6em; }
#IndexJellyPage .ij-idle-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ij-done); box-shadow: 0 0 0 5px rgba(63,214,143,.12); flex: none; }
#IndexJellyPage .ij-idle b { display: block; font-size: 1.05em; }
#IndexJellyPage .ij-idle span { color: var(--ij-muted); font-size: .86em; }
#IndexJellyPage .ij-idle .ij-pillbtn { margin-left: auto; }

/* scanned libraries inside the scan job */
#IndexJellyPage .ij-scanlist { padding: 0 1.6em 1.2em; display: grid; gap: .55em; }
#IndexJellyPage .ij-scanrow { display: grid; grid-template-columns: minmax(7em, 14em) 1fr 4em; gap: .9em; align-items: center; font-size: .86em; }
#IndexJellyPage .ij-scanrow .p { text-align: right; color: var(--ij-muted); }

/* folded parts */
#IndexJellyPage details.ij-more-d { border-top: 1px solid var(--ij-line); }
#IndexJellyPage .ij-panel > details.ij-more-d:first-child { border-top: 0; }
#IndexJellyPage details.ij-more-d > summary { list-style: none; cursor: pointer; padding: .85em 1.6em; color: var(--ij-muted); font-size: .88em; user-select: none; }
#IndexJellyPage details.ij-more-d > summary::-webkit-details-marker { display: none; }
#IndexJellyPage details.ij-more-d > summary::before { content: "▸"; display: inline-block; width: 1.1em; transition: transform .15s; }
#IndexJellyPage details.ij-more-d[open] > summary::before { transform: rotate(90deg); }
#IndexJellyPage details.ij-more-d > summary:hover { color: var(--ij-text); }
#IndexJellyPage .ij-task { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1em; align-items: center; padding: .6em 1.6em; border-top: 1px solid var(--ij-faint); font-size: .9em; }
#IndexJellyPage .ij-task .when { color: var(--ij-muted); font-size: .9em; text-align: right; }
#IndexJellyPage details.ij-more-d .ij-cards { padding-top: .2em; }

/* ---------- libraries ---------- */
#IndexJellyPage .ij-libs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(560px, 100%), 1fr)); gap: 1.1em; align-items: start; }
#IndexJellyPage .ij-lanes { padding: .2em 1.6em 1.2em; }
#IndexJellyPage .ij-lane { border-top: 1px solid var(--ij-faint); }
#IndexJellyPage .ij-lane:first-child { border-top: 0; }
#IndexJellyPage .ij-lane-row { display: grid; grid-template-columns: minmax(9em, 1.1fr) minmax(70px, 1.3fr) 6.2em 7.4em; gap: 1em; align-items: center; padding: .7em 0; }
#IndexJellyPage .ij-lane .k b { display: block; font-weight: 600; font-size: .95em; }
#IndexJellyPage .ij-lane .k span { color: var(--ij-muted); font-size: .78em; }
#IndexJellyPage .ij-lane .v { text-align: right; }
#IndexJellyPage .ij-lane .v b { display: block; font-weight: 650; }
#IndexJellyPage .ij-lane .v span { color: var(--ij-muted); font-size: .76em; }
#IndexJellyPage .ij-lane .st { text-align: right; }
#IndexJellyPage .ij-lane.off .k, #IndexJellyPage .ij-lane.off .ij-track, #IndexJellyPage .ij-lane.off .v { opacity: .45; }
#IndexJellyPage .ij-lib-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); border-top: 1px solid var(--ij-line); }
#IndexJellyPage .ij-stat { padding: .9em 1.6em; border-right: 1px solid var(--ij-faint); }
#IndexJellyPage .ij-stat:last-child { border-right: 0; }
#IndexJellyPage .ij-stat b { display: block; font-size: 1.2em; font-weight: 650; }
#IndexJellyPage .ij-stat span { font-size: .78em; color: var(--ij-muted); }
#IndexJellyPage .ij-stat.new b { color: var(--ij-done); }
#IndexJellyPage .ij-placeholder { padding: 1.2em 1.6em 1.4em; color: var(--ij-muted); font-size: .9em; }

/* missing list */
#IndexJellyPage .ij-missing { padding: 0 0 1em; }
#IndexJellyPage .ij-table-wrap { overflow: auto; max-height: 440px; border-radius: 10px; background: rgba(0,0,0,.22); }
#IndexJellyPage table { width: 100%; border-collapse: collapse; font-size: .85em; }
#IndexJellyPage th { position: sticky; top: 0; z-index: 1; background: #1b1e23; text-align: left; font-weight: 600; color: var(--ij-muted); padding: .5em .8em; border-bottom: 1px solid var(--ij-line); }
#IndexJellyPage td { padding: .45em .8em; border-bottom: 1px solid var(--ij-faint); vertical-align: middle; }
#IndexJellyPage td.cov { width: 1%; padding-right: 0; }
#IndexJellyPage td.cov i { display: block; width: 26px; aspect-ratio: 2/3; border-radius: 4px; background: var(--ij-faint) center/cover; }
#IndexJellyPage td .sub { display: block; color: var(--ij-muted); font-size: .9em; }
#IndexJellyPage td.path { color: var(--ij-muted); word-break: break-all; font-size: .9em; }
#IndexJellyPage td.when { color: var(--ij-muted); white-space: nowrap; }
#IndexJellyPage .ij-note { color: var(--ij-muted); font-size: .8em; padding-top: .55em; }

#IndexJellyPage .ij-empty { text-align: center; padding: 5em 1em; color: var(--ij-muted); }
#IndexJellyPage .ij-empty b { display: block; color: var(--ij-text); font-size: 1.2em; margin-bottom: .4em; }
#IndexJellyPage .ij-error { padding: 1em 1.2em; border-radius: 10px; background: rgba(255,111,97,.12); color: #ffb3aa; margin-bottom: 1.5em; }
#IndexJellyPage .ij-warn { padding: .8em 1.2em; border-radius: 10px; background: rgba(255,178,63,.1); color: #ffd08a; margin-bottom: 1.5em; font-size: .88em; }
#IndexJellyPage button:focus-visible, #IndexJellyPage summary:focus-visible, #IndexJellyPage input:focus-visible, #IndexJellyPage a:focus-visible { outline: 2px solid var(--ij-brand); outline-offset: 2px; }

@media (max-width: 760px) {
    #IndexJellyPage .ij { padding: 1em .8em 3em; }
    #IndexJellyPage .ij-totals { margin-left: 0; gap: 1.6em; }
    #IndexJellyPage .ij-hero { flex-wrap: wrap; padding: 1.2em; gap: 1em; }
    #IndexJellyPage .ij-poster { width: 64px; }
    #IndexJellyPage .ij-heading { flex-basis: calc(100% - 64px - 1em); }
    #IndexJellyPage .ij-side { width: 100%; flex-direction: row; align-items: center; justify-content: space-between; text-align: left; }
    #IndexJellyPage .ij-time, #IndexJellyPage .ij-cards, #IndexJellyPage .ij-lanes, #IndexJellyPage .ij-scanlist, #IndexJellyPage .ij-idle, #IndexJellyPage .ij-more { padding-left: 1.2em; padding-right: 1.2em; }
    #IndexJellyPage .ij-lane-row { grid-template-columns: 1fr auto; gap: .45em 1em; }
    #IndexJellyPage .ij-lane-row .ij-track { grid-column: 1 / -1; grid-row: 2; }
    #IndexJellyPage .ij-lane-row .st { grid-column: 1 / -1; grid-row: 3; text-align: left; }
    #IndexJellyPage .ij-scanrow { grid-template-columns: 1fr 3.5em; }
    #IndexJellyPage .ij-scanrow .ij-track { grid-column: 1 / -1; grid-row: 2; }
    #IndexJellyPage .ij-task { grid-template-columns: 1fr auto; padding-left: 1.2em; padding-right: 1.2em; }
    #IndexJellyPage .ij-task .when { grid-column: 1; text-align: left; }
    #IndexJellyPage .ij-stat { padding: .8em 1.2em; }
    #IndexJellyPage .ij-lane-row { grid-template-columns: 1fr auto auto; }
    #IndexJellyPage .ij-lane-row .st { grid-column: auto; grid-row: auto; text-align: right; }
    #IndexJellyPage .ij-lane-row .st .ij-pill.done { display: none; }
    #IndexJellyPage .ij-lane .v { display: flex; gap: .5em; align-items: baseline; }
    #IndexJellyPage .ij-lane .v span { display: none; }
    #IndexJellyPage th.path, #IndexJellyPage td.path { display: none; }
}
</style>

<div data-role="content">
<div class="content-primary ij">

    <header class="ij-bar">
        <div>
            <h1>IndexJelly</h1>
            <div class="ij-sub" id="ijStatus" data-i18n="loading">Loading…</div>
        </div>
        <div class="ij-totals" id="ijTotals"></div>
        <div class="ij-actions">
            <button type="button" class="ij-btn" id="ijRecount" data-i18n="recount">Recount</button>
            <button type="button" class="ij-btn" id="ijScanAll" data-i18n="scan_all">Scan all libraries</button>
            <button type="button" class="ij-btn" id="ijGear" aria-expanded="false" aria-controls="ijSettings" data-i18n="settings">Settings</button>
        </div>
    </header>

    <div class="ij-settings" id="ijSettings">
        <label><input type="checkbox" id="ijAuto" checked> <span data-i18n="auto_refresh">Auto refresh</span></label>
        <label><span data-i18n="interval">Every</span> <input type="number" id="ijInterval" min="2" max="120" value="5"> <span data-i18n="sec">s</span></label>
        <label><span data-i18n="active_interval">while indexing</span> <input type="number" id="ijActiveInterval" min="1" max="30" value="2"> <span data-i18n="sec">s</span></label>
        <label><span data-i18n="cache">Recount after</span> <input type="number" id="ijCache" min="1" max="1440" value="5"> <span data-i18n="min">min</span></label>
        <label><span data-i18n="limit">List at most</span> <input type="number" id="ijLimit" min="10" max="10000" value="500"> <span data-i18n="items_per_check">items per check</span></label>
        <label><input type="checkbox" id="ijShowPaths"> <span data-i18n="show_paths">Show file paths</span></label>
        <label><input type="checkbox" id="ijTrickplay"> <span data-i18n="check_trickplay">Check trickplay</span></label>
        <label><input type="checkbox" id="ijChapters"> <span data-i18n="check_chapters">Check chapter images</span></label>
        <button type="button" class="ij-save" id="ijSave" data-i18n="save">Save</button>
    </div>

    <div id="ijError"></div>

    <section class="ij-section" id="ijActSection">
        <h2><span data-i18n="activity">Activity</span></h2>
        <div class="ij-stack">
            <div class="ij-stack" id="ijActivity"></div>
            <div id="ijHistory"></div>
        </div>
    </section>

    <section class="ij-section">
        <h2><span data-i18n="libraries">Libraries</span></h2>
        <div class="ij-libs" id="ijLibs"></div>
    </section>
</div>
</div>

<script type="text/javascript">
(function () {
    var pluginId = '8485ee41-9157-4fba-887d-25c21ccee84c';
    var page = document.getElementById('IndexJellyPage');
    var timer = null;
    var last = null;
    var open = {};        // 'libId|check' -> true
    var missing = {};     // 'libId|check' -> { loading, data, error, statsAt }
    var tasksOpen = false;
    var recentOpen = false;
    var ticker = null;
    var lastLibHtml = null;

    /* ---------- language: follows the Jellyfin UI language (Hungarian, otherwise English) ---------- */
    var LANG = (function () {
        var l = (document.documentElement.getAttribute('lang') || navigator.language || 'en').toLowerCase();
        return l.indexOf('hu') === 0 ? 'hu' : 'en';
    })();
    var DEC = LANG === 'hu' ? ',' : '.';
    var I18N = {
        en: {
            loading: 'Loading…', settings: 'Settings', recount: 'Recount', recounting: 'Counting…', scan_all: 'Scan all libraries', scan: 'Scan', scan_started: 'Scan started',
            auto_refresh: 'Auto refresh', interval: 'Every', active_interval: 'while indexing', sec: 's', min: 'min', cache: 'Recount after', limit: 'List at most', items_per_check: 'items per check',
            show_paths: 'Show file paths', check_trickplay: 'Check trickplay', check_chapters: 'Check chapter images', save: 'Save', saved: 'Saved',
            activity: 'Activity', libraries: 'Libraries',
            tot_indexed: 'indexed', tot_items: 'items', tot_missing: 'to do',
            status: 'Jellyfin {v}', counted: 'counted {ago} ago in {dur}', counting_first: 'counting the libraries…', counting: 'recounting…',
            idle: 'Nothing is being indexed', last_scan: 'Last library scan: {ago} ago, {res}.', never_scanned: 'The library scan has not run yet.',
            scanning: 'Scanning', queued: 'queued', library_tasks: 'Library tasks ({n})', run: 'Run', running: 'running',
            never: 'never run', ago: '{x} ago',
            res: { Completed: 'completed', Failed: 'failed', Cancelled: 'cancelled', Aborted: 'aborted' },

        }
        if (!h) {
            var scan = tasks.filter(function (x) { return x.key === 'RefreshLibrary'; })[0];
            var res = scan && scan.lastStatus ? (t('res')[scan.lastStatus] || scan.lastStatus) : '';
            h = '<article class="ij-panel"><div class="ij-idle"><div class="ij-idle-dot"></div><div><b>' + esc(t('idle')) + '</b><span>'
                + esc(scan && scan.lastEndUtc ? t('last_scan', { ago: ago(scan.lastEndUtc), res: res }) : t('never_scanned')) + '</span></div>'
                + (scan ? '<button type="button" class="ij-pillbtn" data-run="' + esc(scan.id) + '">' + esc(t('scan_all')) + '</button>' : '') + '</div></article>';
        }
        return h;
    }
    function resultPill(x) {
        if (x.state !== 'Idle') return '<span class="ij-pill run">' + esc(t('running')) + '</span>';
        if (!x.lastStatus) return '<span class="ij-pill muted">' + esc(t('never')) + '</span>';
        var cls = x.lastStatus === 'Completed' ? 'done' : (x.lastStatus === 'Cancelled' ? 'warn' : 'fail');
        return '<span class="ij-pill ' + cls + '"' + (x.lastError ? ' title="' + esc(x.lastError) + '"' : '') + '>' + esc(t('res')[x.lastStatus] || x.lastStatus) + '</span>';
    }
    /** Library tasks and the recently processed items, folded. */
    function history(data) {
        var tasks = data.tasks || [];
        var rec = (data.activity || {}).recent || [];
        if (!tasks.length && !rec.length) return '';
        var h = '<article class="ij-panel">';
        if (rec.length) {
            h += '<details class="ij-more-d ij-recent"' + (recentOpen ? ' open' : '') + '><summary>' + esc(t('recent', { n: rec.length })) + '</summary><div class="ij-cards">'
                + rec.slice(0, 24).map(function (r) {
                    // a removed item has no page any more, so it gets no link
                    var it = r.action === 'Removed' ? Object.assign({}, r.item, { id: null }) : r.item;
                    var cls = { Added: 'done', Refreshed: 'run', Removed: 'fail' }[r.action] || 'muted';
                    return itemCard({ item: it, when: t('ago', { x: ago(r.atUtc) }) }, '<span class="ij-pill ' + cls + '">' + esc(t('act')[r.action] || r.action) + '</span>');
                }).join('') + '</div></details>';
        }
        if (tasks.length) {
            h += '<details class="ij-more-d ij-tasks"' + (tasksOpen ? ' open' : '') + '><summary>' + esc(t('library_tasks', { n: tasks.length })) + '</summary>';
            tasks.forEach(function (x) {
                h += '<div class="ij-task"><div>' + esc(x.name) + '</div>'
                    + '<div class="when">' + (x.state === 'Idle' && x.lastEndUtc ? esc(t('ago', { x: ago(x.lastEndUtc) })) + ' ' : '') + resultPill(x) + '</div>'
                    + '<button type="button" class="ij-pillbtn" data-run="' + esc(x.id) + '"' + (x.state !== 'Idle' ? ' disabled' : '') + '>' + esc(t('run')) + '</button></div>';
            });
            h += '</details>';
        }
        return h + '</article>';
    }

    /* ---------- libraries ---------- */
    function offReason(lib, c, data) {
        if (c.key === 'trickplay') return !lib.trickplayEnabled ? t('off_lib') : (!data.trickplayAvailable && data.statsComputedAtUtc ? t('off_api') : t('off_plugin'));
        if (c.key === 'chapterImages') return !lib.chapterImagesEnabled ? t('off_lib') : (!data.chaptersAvailable && data.statsComputedAtUtc ? t('off_api') : t('off_plugin'));
        return '';
    }
    function libStats(lib) {
        var order = ['Movie', 'Series', 'Episode', 'MusicAlbum', 'Audio', 'MusicVideo', 'Video'];
        var h = order.filter(function (k) { return lib.itemTypes && lib.itemTypes[k]; }).map(function (k) {
            return '<div class="ij-stat"><b>' + num(lib.itemTypes[k]) + '</b><span>' + esc(t('kinds')[k] || k) + '</span></div>';
        }).join('');
        if (lib.addedLast24h) h += '<div class="ij-stat new"><b>+' + num(lib.addedLast24h) + '</b><span>' + esc(t('new_24h')) + '</span></div>';
        else if (lib.lastAddedUtc) h += '<div class="ij-stat"><b>' + esc(ago(lib.lastAddedUtc)) + '</b><span>' + esc(t('last_added_label')) + '</span></div>';
        return h ? '<div class="ij-lib-stats">' + h + '</div>' : '';
    }
    /** A library, like an expanded StreamJelly session: hero with the library image, one lane per check, numbers below. */
    function library(lib, data) {
        // trickplay and chapter images only make sense in libraries with videos
        var hasVideo = ['Movie', 'Episode', 'MusicVideo', 'Video'].some(function (k) { return lib.itemTypes && lib.itemTypes[k]; });
        var checks = (lib.checks || []).filter(function (c) { return c.applicable > 0 || (c.disabled && hasVideo); });
        var counted = data.statsComputedAtUtc && lib.items;
        var p = counted ? libPct(lib) : null;
        var scanning = lib.refreshStatus && lib.refreshStatus !== 'Idle';
        var labels = t('check');
        // the type is only shown when it adds something ("Movies" above a library called "Movies" does not)
        var ctype = t('ctype')[lib.collectionType] || lib.collectionType || '';
        var h = '<article class="ij-panel">';
        h += '<div class="ij-hero short"><div class="ij-hero-bg"' + bgStyle(img(lib.id, 'Primary', 900, true)) + '></div>'
            + '<div class="ij-heading"><div class="ij-kicker">' + esc(ctype && ctype !== lib.name ? ctype : '') + '</div>'
            + '<h3 class="ij-name">' + esc(lib.name) + '</h3>'
            + '<div class="ij-chips">' + (lib.items ? '<span class="ij-chip">' + esc(t('items_n', { n: num(lib.items) })) + '</span>' : '') + '</div></div>'
            + '<div class="ij-side">' + (p !== null ? '<div><div class="ij-big' + (p >= 100 ? ' done' : '') + '">' + fmtPct(p) + '</div><div class="ij-big-note">' + esc(t('tot_indexed')) + '</div></div>' : '')
            + '<button type="button" class="ij-pillbtn" data-scan="' + esc(lib.id) + '"' + (scanning ? ' disabled' : '') + '>' + esc(scanning ? t('scanning') + '…' : t('scan')) + '</button></div></div>';
        if (scanning) {
            var sp = lib.refreshProgress;
            h += '<div class="ij-time"><span>' + esc(t('scanning')) + '</span>' + bar(sp || 0, { live: true, indet: sp === null || sp === undefined }) + '<span>' + (sp === null || sp === undefined ? '…' : fmtPct(sp)) + '</span></div>';
        }
        if (!data.statsComputedAtUtc) return h + '<div class="ij-placeholder">' + esc(t('not_counted')) + '</div></article>';
        if (!lib.items) return h + '<div class="ij-placeholder">' + esc(t('no_items')) + '</div></article>';

        h += '<div class="ij-lanes">';
        checks.forEach(function (c) {
            var cp = c.disabled ? null : pct(c.done, c.applicable);
            var miss = c.applicable - c.done;
            var key = lib.id + '|' + c.key;
            var lab = labels[c.key] || [c.key, ''];
            var st = c.disabled ? '<span class="ij-pill muted">' + esc(t('off')) + '</span>'
                : (miss > 0 ? '<button type="button" class="ij-pill warn" data-miss="' + esc(key) + '" aria-expanded="' + (open[key] ? 'true' : 'false') + '">' + esc(t('missing_n', { n: num(miss) })) + '</button>'
                    : '<span class="ij-pill done">' + esc(t('complete')) + '</span>');
            h += '<div class="ij-lane' + (c.disabled ? ' off' : '') + '"><div class="ij-lane-row">'
                + '<div class="k" title="' + esc(lab[1]) + '"><b>' + esc(lab[0]) + '</b>' + (c.disabled ? '<span>' + esc(offReason(lib, c, data)) + '</span>' : '') + '</div>'
                + bar(cp)
                + '<div class="v">' + (c.disabled ? '' : '<b>' + fmtPct(cp) + '</b><span>' + num(c.done) + ' / ' + num(c.applicable) + '</span>') + '</div>'
                + '<div class="st">' + st + '</div></div>'
                + (open[key] && !c.disabled && miss > 0 ? '<div class="ij-missing">' + missingList(key) + '</div>' : '')
                + '</div>';
        });
        return h + '</div>' + libStats(lib) + '</article>';
    }
    function missingList(key) {
        var m = missing[key];
        if (!m || m.loading) return '<div class="ij-note">' + esc(t('loading')) + '</div>';
        if (m.error) return '<div class="ij-note">' + esc(m.error) + '</div>';
        var d = m.data, showPath = d.items.some(function (i) { return i.path; });
        var h = '<div class="ij-table-wrap"><table><thead><tr><th></th><th>' + esc(t('th_name')) + '</th><th>' + esc(t('th_added')) + '</th>'
            + (showPath ? '<th class="path">' + esc(t('th_path')) + '</th>' : '') + '</tr></thead><tbody>';
        d.items.forEach(function (it) {
            var desc = describe(it);
            h += '<tr><td class="cov"><i' + bgStyle(img(it.id, 'Primary', 80)) + '></i></td>'
                + '<td>' + linked(it, desc.t) + (desc.s ? '<span class="sub">' + esc(desc.s) + '</span>' : '') + '</td>'
                + '<td class="when">' + esc(shortDate(it.dateCreatedUtc)) + '</td>'
                + (showPath ? '<td class="path">' + esc(it.path || '') + '</td>' : '') + '</tr>';
        });
        h += '</tbody></table></div>';
        if (d.truncated) h += '<div class="ij-note">' + esc(t('truncated', { n: num(d.items.length), total: num(d.total) })) + '</div>';
        if (last && m.statsAt !== last.statsComputedAtUtc) h += '<div class="ij-note">' + esc(t('stale_list')) + '</div>';
        return h;
    }
    function loadMissing(key) {
        var parts = key.split('|');
        missing[key] = { loading: true };
        render();
        ApiClient.getJSON(ApiClient.getUrl('IndexJelly/Missing', { libraryId: parts[0], check: parts[1] })).then(function (d) {
            missing[key] = { data: d, statsAt: last && last.statsComputedAtUtc };
            render();
        }, function (err) {
            missing[key] = { error: t('error', { e: err && err.status ? 'HTTP ' + err.status : String(err) }) };
            render();
        });
    }

    /* ---------- page ---------- */
    function render() {
        if (!last) return;
        var data = last;
        page.querySelector('#ijStatus').innerHTML = statusLine(data);
        page.querySelector('#ijTotals').innerHTML = totals(data);
        page.querySelector('#ijRecount').disabled = !!data.statsComputing;
        page.querySelector('#ijRecount').textContent = data.statsComputing ? t('recounting') : t('recount');
        page.querySelector('#ijError').innerHTML = data.statsError ? '<div class="ij-warn">' + esc(t('stats_error', { e: data.statsError })) + '</div>' : '';
        page.querySelector('#ijActivity').innerHTML = activity(data);
        page.querySelector('#ijHistory').innerHTML = history(data);
        // The library cards only change with a new count or a scan; rebuilding them on every poll
        // would close hover states and make the images flicker.
        var libs = data.libraries || [];
        var libHtml = libs.length
            ? libs.map(function (l) { return library(l, data); }).join('')
            : '<div class="ij-empty" style="grid-column:1/-1"><b>' + esc(t('empty_title')) + '</b>' + esc(t('empty_text')) + '</div>';
        if (libHtml !== lastLibHtml) {
            page.querySelector('#ijLibs').innerHTML = libHtml;
            lastLibHtml = libHtml;
        }
    }
    /** Something is being indexed: poll fast. */
    function isActive(data) {
        var act = data.activity || {};
        return !!data.busy || !!data.statsComputing || (act.processes || []).length > 0 || (act.refreshing || []).length > 0;
    }
    function load(recount) {
        if (!document.body.contains(page)) { stop(); return; }
        ApiClient.getJSON(ApiClient.getUrl('IndexJelly/Status', recount ? { recount: true } : {})).then(function (data) {
            var prevAt = last && last.statsComputedAtUtc;
            last = data;
            // a new count finished: reload the open missing lists
            if (prevAt && prevAt !== data.statsComputedAtUtc) {
                Object.keys(open).forEach(function (k) { if (open[k]) loadMissing(k); });
            }
            render();
            schedule();
        }, function (err) {
            page.querySelector('#ijError').innerHTML = '<div class="ij-error">' + esc(t('error', { e: err && err.status ? 'HTTP ' + err.status : String(err) })) + '</div>';
            schedule();
        });
    }
    /** Next poll: the short interval while something is being indexed, the normal one otherwise. */
    function schedule() {
        if (timer) { clearTimeout(timer); timer = null; }
        if (!page.querySelector('#ijAuto').checked || !document.body.contains(page)) return;
        var idle = Math.max(2, Math.min(120, parseInt(page.querySelector('#ijInterval').value, 10) || 5));
        var active = Math.max(1, Math.min(30, parseInt(page.querySelector('#ijActiveInterval').value, 10) || 2));
        var sec = last && isActive(last) ? Math.min(active, idle) : idle;
        timer = setTimeout(function () { load(false); }, sec * 1000);
    }
    /** Every second: elapsed times and the "counted … ago" line, without asking the server. */
    function tickClock() {
        if (!document.body.contains(page)) { stopTicker(); return; }
        page.querySelectorAll('[data-start]').forEach(function (el) { el.textContent = elapsed(el.getAttribute('data-start')); });
        if (last) page.querySelector('#ijStatus').innerHTML = statusLine(last);
    }
    function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
    function stop() {
        if (timer) { clearTimeout(timer); timer = null; }
        stopTicker();
    }
    function start() {
        stop();
        load(false);
        ticker = setInterval(tickClock, 1000);
    }
    function loadConfig() {
        return ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
            page.querySelector('#ijInterval').value = cfg.RefreshSeconds || 5;
            page.querySelector('#ijActiveInterval').value = cfg.ActiveRefreshSeconds || 2;
            page.querySelector('#ijCache').value = cfg.StatsCacheMinutes || 5;
            page.querySelector('#ijLimit').value = cfg.MissingListLimit || 500;
            page.querySelector('#ijShowPaths').checked = !!cfg.ShowPaths;
            page.querySelector('#ijTrickplay').checked = !!cfg.CheckTrickplay;
            page.querySelector('#ijChapters').checked = !!cfg.CheckChapterImages;
        }, function () { });
    }
    function flash(btn, key, back) {
        btn.textContent = t(key);
        setTimeout(function () { btn.textContent = t(back); }, 1500);
    }
    function post(url) {
        return ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl(url) });
    }

    page.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });

    page.querySelector('#ijGear').addEventListener('click', function () {
        var p = page.querySelector('#ijSettings'), isOpen = !p.classList.contains('open');
        p.classList.toggle('open', isOpen);
        this.setAttribute('aria-expanded', isOpen);
    });
    page.querySelector('#ijSave').addEventListener('click', function () {
        var btn = this;
        ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
            cfg.RefreshSeconds = parseInt(page.querySelector('#ijInterval').value, 10) || 5;
            cfg.ActiveRefreshSeconds = parseInt(page.querySelector('#ijActiveInterval').value, 10) || 2;
            cfg.StatsCacheMinutes = parseInt(page.querySelector('#ijCache').value, 10) || 5;
            cfg.MissingListLimit = parseInt(page.querySelector('#ijLimit').value, 10) || 500;
            cfg.ShowPaths = page.querySelector('#ijShowPaths').checked;
            cfg.CheckTrickplay = page.querySelector('#ijTrickplay').checked;
            cfg.CheckChapterImages = page.querySelector('#ijChapters').checked;
            return ApiClient.updatePluginConfiguration(pluginId, cfg);
        }).then(function () {
            flash(btn, 'saved', 'save');
            start();
        });
    });
    page.querySelector('#ijRecount').addEventListener('click', function () { this.disabled = true; load(true); });
    page.querySelector('#ijScanAll').addEventListener('click', function () {
        var btn = this;
        post('Library/Refresh').then(function () { flash(btn, 'scan_started', 'scan_all'); load(false); });
    });
    page.querySelector('#ijAuto').addEventListener('change', start);
    page.querySelector('#ijInterval').addEventListener('change', start);
    page.querySelector('#ijActiveInterval').addEventListener('change', start);
    page.querySelector('#ijActSection').addEventListener('toggle', function (e) {
        if (!e.target.classList) return;
        if (e.target.classList.contains('ij-recent')) recentOpen = e.target.open;
        else if (e.target.classList.contains('ij-tasks')) tasksOpen = e.target.open;
    }, true);
    page.querySelector('#ijActSection').addEventListener('click', function (e) {
        var b = e.target.closest('[data-run]');
        if (!b) return;
        b.disabled = true;
        post('ScheduledTasks/Running/' + b.getAttribute('data-run')).then(function () { load(false); });
    });
    page.querySelector('#ijLibs').addEventListener('click', function (e) {
        var s = e.target.closest('[data-scan]');
        if (s) {
            s.disabled = true;
            post('Items/' + s.getAttribute('data-scan') + '/Refresh?Recursive=true&ImageRefreshMode=Default&MetadataRefreshMode=Default&ReplaceAllImages=false&ReplaceAllMetadata=false')
                .then(function () { s.textContent = t('scan_started'); load(false); });
            return;
        }
        var m = e.target.closest('[data-miss]');
        if (!m) return;
        var key = m.getAttribute('data-miss');
        open[key] = !open[key];
        if (open[key]) loadMissing(key); else render();
    });

    page.addEventListener('pageshow', function () { loadConfig().then(start); });
    page.addEventListener('pagehide', stop);
    page.addEventListener('viewhide', stop);
    loadConfig().then(start);
})();
</script>
</div>
</body>
</html>
