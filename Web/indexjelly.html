<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>IndexJelly</title>
</head>
<body>
<div id="IndexJellyPage" data-role="page" class="page type-interior pluginConfigurationPage" data-title="IndexJelly">
<style>
#IndexJellyPage {
    --ij-text: #eceef1;
    --ij-muted: #9198a1;
    --ij-faint: rgba(255,255,255,.07);
    --ij-line: rgba(255,255,255,.10);
    --ij-surface: rgba(255,255,255,.035);
    --ij-done: #3fd68f;
    --ij-near: #5aa9ff;
    --ij-partial: #ffb23f;
    --ij-low: #ff6f61;
    --ij-brand: #2ec4c4;
}
#IndexJellyPage .ij { max-width: 1280px; margin: 0 auto; padding: 1.6em 1.6em 4em; color: var(--ij-text); font-variant-numeric: tabular-nums; }
#IndexJellyPage .ij * { box-sizing: border-box; }

/* ---------- top bar ---------- */
#IndexJellyPage .ij-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 1.2em 2.5em; margin-bottom: 2em; }
#IndexJellyPage .ij-bar h1 { font-size: 1.9em; font-weight: 700; letter-spacing: -.02em; margin: 0; line-height: 1.1; }
#IndexJellyPage .ij-sub { color: var(--ij-muted); font-size: .9em; margin-top: .35em; }
#IndexJellyPage .ij-sub .busy { color: var(--ij-brand); }
#IndexJellyPage .ij-totals { display: flex; gap: 2.2em; margin-left: auto; }
#IndexJellyPage .ij-total b { display: block; font-size: 1.6em; font-weight: 650; line-height: 1.1; }
#IndexJellyPage .ij-total span { color: var(--ij-muted); font-size: .82em; }
#IndexJellyPage .ij-actions { display: flex; gap: .5em; flex-wrap: wrap; }
#IndexJellyPage .ij-btn { background: none; border: 1px solid var(--ij-line); color: var(--ij-muted); border-radius: 8px; padding: .45em .8em; cursor: pointer; font: inherit; font-size: .85em; white-space: nowrap; }
#IndexJellyPage .ij-btn:hover, #IndexJellyPage .ij-btn[aria-expanded="true"] { color: var(--ij-text); border-color: rgba(255,255,255,.25); }
#IndexJellyPage .ij-btn:disabled { opacity: .5; cursor: default; }
#IndexJellyPage .ij-btn.primary { background: var(--ij-brand); border-color: var(--ij-brand); color: #06201f; font-weight: 650; }
#IndexJellyPage .ij-settings { display: none; flex-wrap: wrap; gap: 1em 1.6em; align-items: center; padding: 1em 1.2em; margin: -1em 0 2em; border: 1px solid var(--ij-line); border-radius: 10px; font-size: .9em; }
#IndexJellyPage .ij-settings.open { display: flex; }
#IndexJellyPage .ij-settings label { display: flex; gap: .45em; align-items: center; color: var(--ij-muted); }
#IndexJellyPage .ij-settings input[type=number] { width: 4.6em; background: var(--ij-faint); border: 1px solid var(--ij-line); color: var(--ij-text); border-radius: 6px; padding: .3em .4em; font: inherit; }
#IndexJellyPage .ij-settings .ij-btn.primary { margin-left: auto; }

/* ---------- activity ---------- */
#IndexJellyPage .ij-section { margin-bottom: 2.2em; }
#IndexJellyPage .ij-section > h2 { font-size: 1.05em; font-weight: 650; margin: 0 0 .8em; display: flex; align-items: baseline; gap: .7em; }
#IndexJellyPage .ij-section > h2 small { font-weight: 400; color: var(--ij-muted); font-size: .85em; }
#IndexJellyPage .ij-activity { border: 1px solid var(--ij-line); border-radius: 14px; background: var(--ij-surface); overflow: hidden; }
#IndexJellyPage .ij-run { display: grid; grid-template-columns: minmax(0, 1fr) minmax(120px, 2fr) 4.5em; gap: 1em; align-items: center; padding: .85em 1.2em; border-top: 1px solid var(--ij-faint); }
#IndexJellyPage .ij-run:first-child { border-top: 0; }
#IndexJellyPage .ij-run .n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#IndexJellyPage .ij-run .n small { display: block; font-weight: 400; color: var(--ij-muted); font-size: .8em; }
#IndexJellyPage .ij-run .p { text-align: right; font-weight: 650; color: var(--ij-brand); }
#IndexJellyPage .ij-idle { padding: 1em 1.2em; color: var(--ij-muted); font-size: .9em; }
#IndexJellyPage .ij-idle b { color: var(--ij-text); font-weight: 600; }
#IndexJellyPage details.ij-tasks > summary { list-style: none; cursor: pointer; padding: .8em 1.2em; color: var(--ij-muted); font-size: .86em; border-top: 1px solid var(--ij-line); user-select: none; }
#IndexJellyPage details.ij-tasks > summary::-webkit-details-marker { display: none; }
#IndexJellyPage details.ij-tasks > summary::before, #IndexJellyPage .ij-miss-toggle::before { content: "▸"; display: inline-block; width: 1.1em; transition: transform .15s; }
#IndexJellyPage details.ij-tasks[open] > summary::before { transform: rotate(90deg); }
#IndexJellyPage details.ij-tasks > summary:hover { color: var(--ij-text); }
#IndexJellyPage .ij-task { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1em; align-items: center; padding: .55em 1.2em; border-top: 1px solid var(--ij-faint); font-size: .88em; }
#IndexJellyPage .ij-task .r { color: var(--ij-muted); font-size: .92em; text-align: right; }
#IndexJellyPage .ij-task .r.Failed, #IndexJellyPage .ij-task .r.Aborted { color: var(--ij-low); }
#IndexJellyPage .ij-task .r.Cancelled { color: var(--ij-partial); }

/* ---------- current items of a job (Plex-like) ---------- */
#IndexJellyPage .ij-now-list { padding: 0 1.2em .9em; display: grid; gap: .15em; margin-top: -.35em; }
#IndexJellyPage .ij-now { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: .8em; align-items: center; padding: .4em .5em; border-radius: 8px; }
#IndexJellyPage .ij-now:hover { background: rgba(255,255,255,.04); }
#IndexJellyPage .ij-thumb { width: 34px; aspect-ratio: 2/3; border-radius: 4px; background: var(--ij-faint) center/cover; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
#IndexJellyPage .ij-thumb.sq { aspect-ratio: 1; }
#IndexJellyPage .ij-now-main { min-width: 0; }
#IndexJellyPage .ij-now-main .t { display: block; font-weight: 600; font-size: .92em; color: var(--ij-text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#IndexJellyPage .ij-now-main a.t:hover { color: var(--ij-brand); text-decoration: underline; }
#IndexJellyPage .ij-now-main .s { color: var(--ij-muted); font-size: .8em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#IndexJellyPage .ij-now-main .s .op { color: #a8e9e3; }
#IndexJellyPage .ij-now-main .ij-track { height: 3px; margin-top: .35em; max-width: 340px; }
#IndexJellyPage .ij-now-time { color: var(--ij-muted); font-size: .8em; text-align: right; white-space: nowrap; }
#IndexJellyPage .ij-now-more { color: var(--ij-muted); font-size: .8em; padding: .2em .5em 0 calc(34px + 1.3em); }
#IndexJellyPage .ij-act { display: inline-block; font-size: .72em; font-weight: 700; padding: .1em .55em; border-radius: 999px; border: 1.5px solid currentColor; margin-right: .5em; vertical-align: 1px; }
#IndexJellyPage .ij-act.Added { color: var(--ij-done); }
#IndexJellyPage .ij-act.Refreshed { color: var(--ij-near); }
#IndexJellyPage .ij-act.Updated { color: var(--ij-muted); }
#IndexJellyPage .ij-act.Removed { color: var(--ij-low); }
#IndexJellyPage details.ij-tasks .ij-now-list { padding-top: .6em; margin-top: 0; }

/* ---------- bars ---------- */
#IndexJellyPage .ij-track { position: relative; height: 6px; border-radius: 6px; background: rgba(255,255,255,.09); overflow: hidden; }
#IndexJellyPage .ij-track b { position: absolute; inset: 0 auto 0 0; border-radius: 6px; background: var(--c, var(--ij-brand)); transition: width .4s ease; }
#IndexJellyPage .ij-track.live b { background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,.25) 50%, rgba(255,255,255,0) 100%); background-size: 200% 100%; animation: ij-shine 1.6s linear infinite; background-color: var(--ij-brand); }
@keyframes ij-shine { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { #IndexJellyPage .ij-track.live b { animation: none; } }

/* ---------- libraries ---------- */
#IndexJellyPage .ij-libs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 1.1em; align-items: start; }
#IndexJellyPage .ij-lib { border-radius: 16px; overflow: hidden; background: var(--ij-surface); border: 1px solid var(--ij-line); }
#IndexJellyPage .ij-lib.wide { grid-column: 1 / -1; }
#IndexJellyPage .ij-lib-head { position: relative; display: flex; gap: 1em; align-items: flex-start; padding: 1.2em 1.2em 1em; isolation: isolate; }
#IndexJellyPage .ij-lib-bg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: .22; }
#IndexJellyPage .ij-lib-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(16,18,22,.96) 0%, rgba(16,18,22,.6) 100%); }
#IndexJellyPage .ij-ring { flex: none; width: 58px; height: 58px; }
#IndexJellyPage .ij-ring circle { fill: none; stroke-width: 6; }
#IndexJellyPage .ij-ring .bg { stroke: rgba(255,255,255,.1); }
#IndexJellyPage .ij-ring .fg { stroke: var(--c); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .5s ease; }
#IndexJellyPage .ij-ring text { fill: var(--ij-text); font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
#IndexJellyPage .ij-lib-title { flex: 1; min-width: 0; }
#IndexJellyPage .ij-lib-title h3 { margin: 0; font-size: 1.2em; font-weight: 700; line-height: 1.2; }
#IndexJellyPage .ij-lib-title .meta { color: var(--ij-muted); font-size: .82em; margin-top: .3em; }
#IndexJellyPage .ij-lib-title .meta span + span::before { content: ""; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--ij-muted); vertical-align: middle; margin: 0 .55em; }
#IndexJellyPage .ij-lib-title .new { color: var(--ij-done); }
#IndexJellyPage .ij-lib-scan { margin-top: .7em; display: flex; align-items: center; gap: .7em; font-size: .82em; color: var(--ij-brand); }
#IndexJellyPage .ij-lib-scan .ij-track { flex: 1; min-width: 80px; }
#IndexJellyPage .ij-lib-head .ij-btn { flex: none; }
#IndexJellyPage .ij-checks { padding: .3em 1.2em 1em; }
#IndexJellyPage .ij-check { border-top: 1px solid var(--ij-faint); }
#IndexJellyPage .ij-check-row { display: grid; grid-template-columns: minmax(8em, 1.1fr) minmax(80px, 1.6fr) 7.5em; gap: .9em; align-items: center; padding: .6em 0; font-size: .9em; }
#IndexJellyPage .ij-check-row .k { color: #c9ced4; }
#IndexJellyPage .ij-check-row .k small { display: block; color: var(--ij-muted); font-size: .82em; }
#IndexJellyPage .ij-check-row .v { text-align: right; white-space: nowrap; }
#IndexJellyPage .ij-check-row .v b { font-weight: 650; }
#IndexJellyPage .ij-check-row .v span { color: var(--ij-muted); font-size: .85em; }
#IndexJellyPage .ij-check.off .ij-check-row { opacity: .45; }
#IndexJellyPage .ij-miss-toggle { background: none; border: 0; padding: 0 0 .6em; color: var(--ij-partial); font: inherit; font-size: .82em; cursor: pointer; }
#IndexJellyPage .ij-miss-toggle:hover { text-decoration: underline; }
#IndexJellyPage .ij-miss-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
#IndexJellyPage .ij-missing { padding: 0 0 1em; }
#IndexJellyPage .ij-table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; border-radius: 8px; background: rgba(0,0,0,.18); }
#IndexJellyPage table { width: 100%; border-collapse: collapse; font-size: .84em; }
#IndexJellyPage th { position: sticky; top: 0; background: #1b1e23; text-align: left; font-weight: 600; color: var(--ij-muted); padding: .45em .7em; border-bottom: 1px solid var(--ij-line); }
#IndexJellyPage td { padding: .45em .7em; border-bottom: 1px solid var(--ij-faint); vertical-align: top; }
#IndexJellyPage td a { color: var(--ij-text); text-decoration: none; }
#IndexJellyPage td a:hover { color: var(--ij-brand); text-decoration: underline; }
#IndexJellyPage td.path { color: var(--ij-muted); word-break: break-all; font-size: .92em; }
#IndexJellyPage .ij-note { color: var(--ij-muted); font-size: .8em; padding-top: .5em; }
#IndexJellyPage .ij-placeholder { padding: 1.4em 1.2em; color: var(--ij-muted); font-size: .9em; }

#IndexJellyPage .ij-empty { text-align: center; padding: 5em 1em; color: var(--ij-muted); }
#IndexJellyPage .ij-empty b { display: block; color: var(--ij-text); font-size: 1.2em; margin-bottom: .4em; }
#IndexJellyPage .ij-error { padding: 1em 1.2em; border-radius: 10px; background: rgba(255,111,97,.12); color: #ffb3aa; margin-bottom: 1.5em; }
#IndexJellyPage .ij-warn { padding: .8em 1.2em; border-radius: 10px; background: rgba(255,178,63,.1); color: #ffd08a; margin-bottom: 1.5em; font-size: .88em; }
#IndexJellyPage button:focus-visible, #IndexJellyPage summary:focus-visible, #IndexJellyPage input:focus-visible, #IndexJellyPage a:focus-visible { outline: 2px solid var(--ij-brand); outline-offset: 2px; }

@media (max-width: 760px) {
    #IndexJellyPage .ij { padding: 1em .8em 3em; }
    #IndexJellyPage .ij-totals { margin-left: 0; gap: 1.6em; }
    #IndexJellyPage .ij-run { grid-template-columns: 1fr 3.5em; }
    #IndexJellyPage .ij-run .ij-track { grid-column: 1 / -1; grid-row: 2; }
    #IndexJellyPage .ij-check-row { grid-template-columns: 1fr auto; }
    #IndexJellyPage .ij-check-row .ij-track { grid-column: 1 / -1; grid-row: 2; }
    #IndexJellyPage .ij-task { grid-template-columns: 1fr auto; }
    #IndexJellyPage .ij-task .r { grid-column: 1; text-align: left; }
}
</style>

<div data-role="content">
<div class="content-primary ij">

    <header class="ij-bar">
        <div>
            <h1>IndexJelly</h1>
            <div class="ij-sub" id="ijStatus" data-i18n="loading">Loading…</div>
        </div>
        <div class="ij-totals" id="ijTotals"></div>
        <div class="ij-actions">
            <button type="button" class="ij-btn" id="ijRecount" data-i18n="recount">Recount</button>
            <button type="button" class="ij-btn" id="ijScanAll" data-i18n="scan_all">Scan all libraries</button>
            <button type="button" class="ij-btn" id="ijGear" aria-expanded="false" aria-controls="ijSettings" data-i18n="settings">Settings</button>
        </div>
    </header>

    <div class="ij-settings" id="ijSettings">
        <label><input type="checkbox" id="ijAuto" checked> <span data-i18n="auto_refresh">Auto refresh</span></label>
        <label><span data-i18n="interval">Every</span> <input type="number" id="ijInterval" min="2" max="120" value="5"> <span data-i18n="sec">s</span></label>
        <label><span data-i18n="active_interval">while indexing</span> <input type="number" id="ijActiveInterval" min="1" max="30" value="2"> <span data-i18n="sec">s</span></label>
        <label><span data-i18n="cache">Recount after</span> <input type="number" id="ijCache" min="1" max="1440" value="5"> <span data-i18n="min">min</span></label>
        <label><span data-i18n="limit">List at most</span> <input type="number" id="ijLimit" min="10" max="10000" value="500"> <span data-i18n="items_per_check">items per check</span></label>
        <label><input type="checkbox" id="ijShowPaths"> <span data-i18n="show_paths">Show file paths</span></label>
        <label><input type="checkbox" id="ijTrickplay"> <span data-i18n="check_trickplay">Check trickplay</span></label>
        <label><input type="checkbox" id="ijChapters"> <span data-i18n="check_chapters">Check chapter images</span></label>
        <button type="button" class="ij-btn primary" id="ijSave" data-i18n="save">Save</button>
    </div>

    <div id="ijError"></div>

    <section class="ij-section">
        <h2><span data-i18n="activity">Activity</span></h2>
        <div class="ij-activity" id="ijActivity"></div>
    </section>

    <section class="ij-section">
        <h2><span data-i18n="libraries">Libraries</span> <small id="ijLibNote"></small></h2>
        <div class="ij-libs" id="ijLibs"></div>
    </section>
</div>
</div>

    function render() {
        if (!last) return;
        var data = last;
        page.querySelector('#ijStatus').innerHTML = statusLine(data);
        page.querySelector('#ijTotals').innerHTML = totals(data);
        page.querySelector('#ijRecount').disabled = !!data.statsComputing;
        page.querySelector('#ijRecount').textContent = data.statsComputing ? t('recounting') : t('recount');
        page.querySelector('#ijError').innerHTML = data.statsError ? '<div class="ij-warn">' + esc(t('stats_error', { e: data.statsError })) + '</div>' : '';
        page.querySelector('#ijActivity').innerHTML = activity(data);
        // The library cards only change with a new count or a scan; rebuilding them on every poll
        // would close hover states and make the images flicker.
        var libs = data.libraries || [];
        var libHtml = libs.length
            ? libs.map(function (l) { return library(l, data); }).join('')
            : '<div class="ij-empty" style="grid-column:1/-1"><b>' + esc(t('empty_title')) + '</b>' + esc(t('empty_text')) + '</div>';
        if (libHtml !== lastLibHtml) {
            page.querySelector('#ijLibs').innerHTML = libHtml;
            lastLibHtml = libHtml;
        }
    }
    /** Something is being indexed: poll fast. */
    function isActive(data) {
        var act = data.activity || {};
        return !!data.busy || !!data.statsComputing || (act.processes || []).length > 0 || (act.refreshing || []).length > 0;
    }
    function load(recount) {
        if (!document.body.contains(page)) { stop(); return; }
        ApiClient.getJSON(ApiClient.getUrl('IndexJelly/Status', recount ? { recount: true } : {})).then(function (data) {
            var prevAt = last && last.statsComputedAtUtc;
            last = data;
            // a new count finished: reload the open missing lists
            if (prevAt && prevAt !== data.statsComputedAtUtc) {
                Object.keys(open).forEach(function (k) { if (open[k]) loadMissing(k); });
            }
            render();
            schedule();
        }, function (err) {
            page.querySelector('#ijError').innerHTML = '<div class="ij-error">' + esc(t('error', { e: err && err.status ? 'HTTP ' + err.status : String(err) })) + '</div>';
            schedule();
        });
    }
    /** Next poll: the short interval while something is being indexed, the normal one otherwise. */
    function schedule() {
        if (timer) { clearTimeout(timer); timer = null; }
        if (!page.querySelector('#ijAuto').checked || !document.body.contains(page)) return;
        var idle = Math.max(2, Math.min(120, parseInt(page.querySelector('#ijInterval').value, 10) || 5));
        var active = Math.max(1, Math.min(30, parseInt(page.querySelector('#ijActiveInterval').value, 10) || 2));
        var sec = last && isActive(last) ? Math.min(active, idle) : idle;
        timer = setTimeout(function () { load(false); }, sec * 1000);
    }
    /** Every second: elapsed times and the "counted … ago" line, without asking the server. */
    function tickClock() {
        if (!document.body.contains(page)) { stopTicker(); return; }
        page.querySelectorAll('[data-start]').forEach(function (el) { el.textContent = elapsed(el.getAttribute('data-start')); });
        if (last) page.querySelector('#ijStatus').innerHTML = statusLine(last);
    }
    function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }
    function stop() {
        if (timer) { clearTimeout(timer); timer = null; }
        stopTicker();
    }
    function start() {
        stop();
        load(false);
        ticker = setInterval(tickClock, 1000);
    }
    function loadConfig() {
        return ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
            page.querySelector('#ijInterval').value = cfg.RefreshSeconds || 5;
            page.querySelector('#ijActiveInterval').value = cfg.ActiveRefreshSeconds || 2;
            page.querySelector('#ijCache').value = cfg.StatsCacheMinutes || 5;
            page.querySelector('#ijLimit').value = cfg.MissingListLimit || 500;
            page.querySelector('#ijShowPaths').checked = !!cfg.ShowPaths;
            page.querySelector('#ijTrickplay').checked = !!cfg.CheckTrickplay;
            page.querySelector('#ijChapters').checked = !!cfg.CheckChapterImages;
        }, function () { });
    }
    function flash(btn, key, back) {
        btn.textContent = t(key);
        setTimeout(function () { btn.textContent = t(back); }, 1500);
    }
    function post(url) {
        return ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl(url) });
    }

    page.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });

    page.querySelector('#ijGear').addEventListener('click', function () {
        var p = page.querySelector('#ijSettings'), isOpen = !p.classList.contains('open');
        p.classList.toggle('open', isOpen);
        this.setAttribute('aria-expanded', isOpen);
    });
    page.querySelector('#ijSave').addEventListener('click', function () {
        var btn = this;
        ApiClient.getPluginConfiguration(pluginId).then(function (cfg) {
            cfg.RefreshSeconds = parseInt(page.querySelector('#ijInterval').value, 10) || 5;
            cfg.ActiveRefreshSeconds = parseInt(page.querySelector('#ijActiveInterval').value, 10) || 2;
            cfg.StatsCacheMinutes = parseInt(page.querySelector('#ijCache').value, 10) || 5;
            cfg.MissingListLimit = parseInt(page.querySelector('#ijLimit').value, 10) || 500;
            cfg.ShowPaths = page.querySelector('#ijShowPaths').checked;
            cfg.CheckTrickplay = page.querySelector('#ijTrickplay').checked;
            cfg.CheckChapterImages = page.querySelector('#ijChapters').checked;
            return ApiClient.updatePluginConfiguration(pluginId, cfg);
        }).then(function () {
            flash(btn, 'saved', 'save');
            start();
        });
    });
    page.querySelector('#ijRecount').addEventListener('click', function () { this.disabled = true; load(true); });
    page.querySelector('#ijScanAll').addEventListener('click', function () {
        var btn = this;
        post('Library/Refresh').then(function () { flash(btn, 'scan_started', 'scan_all'); load(false); });
    });
    page.querySelector('#ijAuto').addEventListener('change', start);
    page.querySelector('#ijInterval').addEventListener('change', start);
    page.querySelector('#ijActiveInterval').addEventListener('change', start);
    page.querySelector('#ijActivity').addEventListener('toggle', function (e) {
        if (!e.target.classList) return;
        if (e.target.classList.contains('ij-recent')) recentOpen = e.target.open;
        else if (e.target.classList.contains('ij-tasks')) tasksOpen = e.target.open;
    }, true);
    page.querySelector('#ijActivity').addEventListener('click', function (e) {
        var b = e.target.closest('[data-run]');
        if (!b) return;
        b.disabled = true;
        post('ScheduledTasks/Running/' + b.getAttribute('data-run')).then(function () { load(false); });
    });
    page.querySelector('#ijLibs').addEventListener('click', function (e) {
        var s = e.target.closest('[data-scan]');
        if (s) {
            s.disabled = true;
            post('Items/' + s.getAttribute('data-scan') + '/Refresh?Recursive=true&ImageRefreshMode=Default&MetadataRefreshMode=Default&ReplaceAllImages=false&ReplaceAllMetadata=false')
                .then(function () { s.textContent = t('scan_started'); load(false); });
            return;
        }
        var m = e.target.closest('[data-miss]');
        if (!m) return;
        var key = m.getAttribute('data-miss');
        open[key] = !open[key];
        if (open[key]) loadMissing(key); else render();
    });

    page.addEventListener('pageshow', function () { loadConfig().then(start); });
    page.addEventListener('pagehide', stop);
    page.addEventListener('viewhide', stop);
    loadConfig().then(start);
})();
</script>
</div>
</body>
</html>
